<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Financial Document Q&A</title>
    <style>
        :root {
            --ink: #14213d;
            --muted: #6b7280;
            --border: #e5e8f0;
            --bg-soft: #f6f8fc;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-soft: #eef2ff;
            --teal: #0d9488;
            --error: #dc2626;
            --error-soft: #fef2f2;
            --success: #059669;
            --success-soft: #ecfdf5;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--ink);
            max-width: 660px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
            line-height: 1.5;
            background:
                    radial-gradient(circle at 15% 0%, #eef2ff 0%, transparent 45%),
                    radial-gradient(circle at 100% 10%, #f0fdfa 0%, transparent 40%),
                    #ffffff;
            min-height: 100vh;
        }

        header {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        header .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--primary);
            background: var(--primary-soft);
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            margin-bottom: 0.9rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
            background: linear-gradient(90deg, var(--ink), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            color: var(--muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.6rem;
            margin-bottom: 1.3rem;
            background: #fff;
            box-shadow: 0 1px 2px rgba(20, 33, 61, 0.04), 0 8px 24px -18px rgba(20, 33, 61, 0.25);
        }

        .card h2 {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 1.1rem;
        }

        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
            margin-bottom: 0.35rem;
        }

        select, input[type="file"], textarea {
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.65rem 0.75rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: var(--bg-soft);
            color: var(--ink);
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        select { margin-bottom: 1rem; cursor: pointer; }
        input[type="file"] { margin-bottom: 1rem; padding: 0.55rem 0.65rem; cursor: pointer; }
        textarea { resize: vertical; margin-bottom: 1rem; }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
        }

        button {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.65rem 1.4rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 14px -6px rgba(79, 70, 229, 0.55);
            transition: transform 0.1s ease, box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -6px rgba(79, 70, 229, 0.65);
        }

        button:disabled {
            background: var(--border);
            color: var(--muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .active-doc {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 0.88rem;
            color: var(--muted);
            background: var(--success-soft);
            border: 1px solid #d1fae5;
            padding: 0.55rem 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.1rem;
        }

        .active-doc strong {
            color: var(--ink);
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
            flex-shrink: 0;
        }

        .no-doc {
            font-size: 0.88rem;
            color: var(--muted);
            background: var(--bg-soft);
            border: 1px dashed var(--border);
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.1rem;
        }

        .banner {
            font-size: 0.88rem;
            font-weight: 500;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.3rem;
            border: 1px solid transparent;
        }

        .banner.error {
            color: var(--error);
            background: var(--error-soft);
            border-color: #fecaca;
        }

        .banner.success {
            color: var(--success);
            background: var(--success-soft);
            border-color: #a7f3d0;
        }

        .answer-card {
            border-color: #c7d2fe;
            background: linear-gradient(180deg, #fbfbff 0%, #ffffff 100%);
        }

        .answer-card h2 { color: var(--primary-dark); }

        .answer {
            white-space: pre-wrap;
            font-size: 0.95rem;
            color: var(--ink);
            border-left: 3px solid var(--primary);
            padding-left: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <span class="eyebrow">📄 Document Assistant</span>
    <h1>LedgerLens</h1>
    <p>Upload a loan, insurance, bond or mutual fund document, then ask about its terms and conditions.</p>
</header>

<p class="banner error" th:if="${error}" th:text="${error}"></p>
<p class="banner success" th:if="${message}" th:text="${message}"></p>

<div class="card">
    <h2><span class="step-badge">1</span> Upload Document</h2>
    <form method="post" th:action="@{/upload}" enctype="multipart/form-data">
        <label for="docType">Document type</label>
        <select id="docType" name="docType">
            <option th:each="t : ${docTypes}" th:value="${t}" th:text="${t.label}"></option>
        </select>

        <label for="file">File</label>
        <input id="file" type="file" name="file" accept=".pdf,.docx,.doc,.txt" required>

        <button type="submit">Upload</button>
    </form>
</div>

<div class="card">
    <h2><span class="step-badge">2</span> Ask a Question</h2>

    <div class="active-doc" th:if="${documentId}">
        <span class="dot"></span>
        <span>Active document:</span> <strong th:text="${fileName}"></strong>
    </div>
    <p class="no-doc" th:unless="${documentId}">Upload a document first to start asking questions.</p>

    <form method="post" th:action="@{/ask}">
        <input type="hidden" name="documentId" th:value="${documentId}">
        <input type="hidden" name="fileName" th:value="${fileName}">
        <textarea name="question" rows="3" maxlength="500"
                  placeholder="Type your question here"
                  th:text="${question}"></textarea>
        <button type="submit" th:disabled="${documentId == null}">Ask</button>
    </form>
</div>

<div class="card answer-card" th:if="${answer}">
    <h2>💡 Answer</h2>
    <div class="answer" th:text="${answer}"></div>
</div>

</body>
</html>
